<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Library · <span id="who"></span></h1><button class="ghost" onclick="logout()">Sign out</button></header>
<main>
<div class="stats"><div class="stat"><b id="pts">0</b>Reward points</div><div class="stat"><b id="held">0</b>Books held</div><div class="stat"><b id="owed">0</b>Fine owed</div></div>
<p id="rules"></p>
<section class="box" id="tm" style="display:none"><h2>Demo time machine</h2>
<p>Today is <b id="today"></b> (<span id="off">0</span> days ahead)</p>
<div class="row"><button onclick="skip(7)">Skip 7 days</button><button onclick="skip(20)">Skip 20 days</button><button class="del" onclick="skip(0)">Reset</button></div>
<p>Skip ahead, then return a book to see fines vs reward points.</p></section>
<section class="box" id="pp" style="display:none"><h2>Pay fine</h2><p id="pinfo"></p>
<div class="row"><select id="pm"><option value="upi">UPI</option><option value="card">Card</option><option value="netbanking">Net banking</option></select><button onclick="payNow()">Pay now</button><button class="del" onclick="$('#pp').style.display='none'">Cancel</button></div>
<p>Demo payment: no real money moves.</p></section>
<section class="box"><h2>My books</h2><div class="tbl"><table><thead><tr><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody id="mine"></tbody></table></div></section>
<section class="box"><h2>Find a book</h2><div class="row"><input id="q" placeholder="Search title, author or section"></div>
<div class="tbl"><table><thead><tr><th>Title</th><th>Author</th><th>Section</th><th>Available</th><th></th></tr></thead><tbody id="books"></tbody></table></div></section>
</main><script src="common.js"></script><script>
guard('student');
let ROWS=[],PAYING=null;
function openPay(id){const r=ROWS.find(x=>x.id==id);PAYING=id;$('#pinfo').textContent=`Fine of ₹${r.fine-r.fine_paid} for "${r.title}"`;$('#pp').style.display='block';$('#pp').scrollIntoView();}
async function payNow(){const d=await api('/pay','POST',{borrowalId:PAYING,method:$('#pm').value});$('#pp').style.display='none';alert(`Paid ₹${d.amount} by ${d.method.toUpperCase()}. Receipt ${d.ref}`);refresh();}
async function loadMine(){
  const {me,rows,rules}=await api('/my');ROWS=rows;
  $('#pts').textContent=me.points;
  $('#rules').textContent=`Keep a book ${rules.LOAN_DAYS} days. Return on time: +${rules.REWARD} points. Late: ${rules.FINE_PER_DAY} per day. Limit ${rules.MAX_BOOKS} books.`;
  const open=rows.filter(r=>!r.returned_at);
  $('#held').textContent=open.length;
  $('#owed').textContent='₹'+rows.filter(r=>r.returned_at).reduce((s,r)=>s+r.fine-r.fine_paid,0);
  $('#mine').innerHTML=rows.length?rows.map(r=>{
    const st=r.returned_at?(r.fine?(r.fine_paid>=r.fine?`<span class="ok">Late, fine ₹${r.fine} paid</span>`:`<span class="late">Late, fine ₹${r.fine} unpaid</span>`):`<span class="ok">Returned on time +${r.reward_points}</span>`)
      :(r.fine?`<span class="late">Overdue, fine ${r.fine}</span>`:'Borrowed');
    return `<tr><td>${esc(r.title)}</td><td>${fmt(r.borrowed_at)}</td><td>${fmt(r.due_date)}</td><td>${st}</td>
    <td>${!r.returned_at?`<button onclick="ret(${r.id})">Return</button>`:(r.fine>r.fine_paid?`<button onclick="openPay(${r.id})">Pay fine</button>`:'')}</td></tr>`}).join(''):'<tr><td colspan="5">No books yet. Borrow one below.</td></tr>';
}
async function loadBooks(){
  const b=await api('/books?q='+encodeURIComponent($('#q').value));
  $('#books').innerHTML=b.length?b.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.author)}</td><td>${esc(x.section)}</td><td>${x.available_copies}/${x.total_copies}</td>
  <td><button ${x.available_copies?'':'disabled'} onclick="borrow(${x.id})">Borrow</button></td></tr>`).join(''):'<tr><td colspan="5">No matching books.</td></tr>';
}
async function borrow(id){await api('/borrow','POST',{bookId:id});refresh();}
async function ret(id){const r=await api('/return/'+id,'POST');
  alert(r.late?`Returned ${r.late} day(s) late. Fine: ${r.fine}`:`Returned on time! +${r.points} points`);refresh();}
async function loadDemo(){const d=await api('/demo');if(!d.demo)return;$('#tm').style.display='block';$('#today').textContent=fmt(d.today);$('#off').textContent=d.skipDays;}
async function skip(n){await api(n?'/demo/skip':'/demo/reset','POST',{days:n});refresh();}
const refresh=()=>{loadMine();loadBooks();loadDemo();};
$('#q').oninput=loadBooks; refresh();
</script></body></html>
