<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account</title><link rel="stylesheet" href="style.css"></head><body>
<div class="login"><h1>Create account</h1>
<select id="role" style="width:100%;margin-bottom:10px"><option value="student">Student</option><option value="librarian">Admin (librarian)</option></select>
<input id="name" placeholder="Full name" autocomplete="name">
<input id="email" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="new-password">
<input id="code" type="password" placeholder="Admin code" style="display:none">
<div id="msg" role="alert"></div><button id="go">Register</button>
<p>Already registered? <a href="/">Sign in</a></p></div>
<script src="common.js"></script><script>
$('#role').onchange=()=>$('#code').style.display=$('#role').value==='librarian'?'block':'none';
$('#go').onclick=async()=>{
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    name:$('#name').value.trim(),email:$('#email').value.trim(),password:$('#pw').value,role:$('#role').value,adminCode:$('#code').value})});
  const d=await r.json(); if(!r.ok){$('#msg').textContent=d.error;const f=r.status==403?'#code':'#pw';$(f).value='';$(f).focus();return;}
  alert('Account created. Please sign in.'); location.href='/';
};
</script></body></html>
